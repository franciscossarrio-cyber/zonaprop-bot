name: Alertas Zonaprop

on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 minutos (UTC)
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write             # necesario para commitear vistos.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Buscar publicaciones nuevas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python zonaprop_bot.py

      - name: Guardar estado
        run: |
          git config user.name "zonaprop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add vistos.json
          git diff --staged --quiet || git commit -m "estado: $(date -u +%F\ %H:%M)"
          git push
